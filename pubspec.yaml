name: bandwise
description: "Bandwise — independent IELTS Academic preparation app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  just_audio: ^0.10.6
  record: ^7.1.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg
    # Listening sets: script.json, questions.json, and the built audio
    # (listening.mp3, timestamps.json). The source recordings in audio/ are
    # not bundled.
    - assets/listening/set_a/
    - assets/listening/set_b/
    # Speaking: questions and the examiner's recordings (mp3/<id>.mp3). The
    # source WAVs in audio/ are not bundled.
    - assets/speaking/content.json
    - assets/speaking/mp3/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
